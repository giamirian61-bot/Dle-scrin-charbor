name: Stream Harbor smoke check

on:
  push:
    branches:
      - dev-live-hardening
      - "feature-*"
      - "hotfix-*"

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Syntax check backend
        run: node --check server.js

      - name: Syntax check worker
        run: node --check worker.js

      - name: Syntax check dashboard
        run: node --check dashboard.js

      - name: Verify asynchronous stream start contract
        run: |
          node -e "const s=require('fs').readFileSync('server.js','utf8'); if(!s.includes('res.status(202).json')) throw new Error('missing 202 start acknowledgement'); if(!s.includes('stream_start_requested')) throw new Error('missing start requested event'); if(!s.includes('stream_start_failed')) throw new Error('missing background start failure handling');"
          node -e "const s=require('fs').readFileSync('dashboard.js','utf8'); if(!s.includes('waitForMediaFlow(streamId,timeoutMs=90_000)')) throw new Error('media flow wait not hardened');"

      - name: Verify loop-safe media normalization
        run: |
          node -e "const s=require('fs').readFileSync('server.js','utf8'); for (const needle of ['const BITRATE_POLICY_VERSION = 3;','realFrameRate:video.r_frame_rate','loop_timing_normalization_required','fps=30,format=yuv420p,setpts=N/(30*TB)','aresample=48000:async=1:first_pts=0,apad','\"-shortest\"']) if(!s.includes(needle)) throw new Error('missing loop stability contract: '+needle);"
          node -e "const s=require('fs').readFileSync('server.js','utf8'); if(!s.includes('sourceProfile = chooseProfile(sourceProbe);')) throw new Error('bucket preparation does not re-evaluate the current source probe');"

      - name: Verify preparation speed and recovery contract
        run: |
          node -e "const s=require('fs').readFileSync('server.js','utf8'); for (const needle of ['recoverInterruptedBucketPreparation','prepare_state_recovered','\"-preset\",\"ultrafast\"','\"-tune\",\"zerolatency\"','fps=30,format=yuv420p,setpts=N/(30*TB)']) if(!s.includes(needle)) throw new Error('missing preparation contract: '+needle);"
          node -e "const s=require('fs').readFileSync('server.js','utf8'); if(s.includes('\"-threads\",String(PREPARE_THREADS)')) throw new Error('bucket preparation still manually caps x264 threads'); if(!s.includes('status:\"PREPARE_NEEDED\"')) throw new Error('interrupted preparation is not reset');"


      - name: Verify parallel prepared upload contract
        run: |
          node -e "const s=require('fs').readFileSync('server.js','utf8'); for (const needle of ['const PART_BYTES = 16 * 1024 * 1024;','const MAX_IN_FLIGHT_PARTS = 4;','const inFlight = new Set();','schedulePreparedPart','await Promise.race(inFlight)','await Promise.all(inFlight)','parts.sort((a,b) => a.PartNumber - b.PartNumber)']) if(!s.includes(needle)) throw new Error('missing parallel upload contract: '+needle);"
          node -e "const s=require('fs').readFileSync('server.js','utf8'); if(s.includes('await uploadPreparedPart(body);')) throw new Error('prepared upload still blocks ffmpeg stdout loop');"

      - name: Verify preparation queue recovery contract
        run: |
          node -e "const s=require('fs').readFileSync('server.js','utf8'); for (const needle of ['const recoveredPrepareIds = await recoverInterruptedBucketPreparation();','prepareQueue.push({ mediaId, queuedAt:new Date().toISOString() })','setImmediate(() => runNextPrepareJob()','const livePrepareStatus =','prepareJob?.mediaId === item?.id ? \"PREPARING\"','queuedPrepareIds.has(String(item?.id)) ? \"PREPARE_QUEUED\"']) if(!s.includes(needle)) throw new Error('missing prepare queue recovery contract: '+needle);"
          node -e "const s=require('fs').readFileSync('server.js','utf8'); if(s.includes('\"PREPARING\",\"PREPARE_QUEUED\",\n    \"PREPARE_FAILED\"')) throw new Error('stale persisted preparing statuses still drive public status');"

      - name: Verify re-probe before full preparation
        run: |
          node -e "const s=require('fs').readFileSync('server.js','utf8'); for (const needle of ['sourceProbe = await analyzeRemoteMedia(sourceUrl, item.size || null);','sourceProfile = chooseProfile(sourceProbe);','bitratePolicyVersion:BITRATE_POLICY_VERSION','return { state:\"already_ready\", mediaId:id, profile:sourceProfile };']) if(!s.includes(needle)) throw new Error('missing re-probe contract: '+needle);"


      - name: Verify effective bucket source selection
        run: |
          node -e "const s=require('fs').readFileSync('server.js','utf8'); for (const needle of ['function chooseEffectiveBucketVariant(item)','if (sourceProfile?.streamReady && sourceProfile.mode === \"copy\")','kind:\"source\"','const effectiveVariant = chooseEffectiveBucketVariant(bucketItem);','const effectiveVariant = media ? chooseEffectiveBucketVariant(media) : { ready:false };']) if(!s.includes(needle)) throw new Error('missing effective bucket source contract: '+needle);"
          node -e "const s=require('fs').readFileSync('server.js','utf8'); if(s.includes('const effectiveKey = bucketItem.preparedKey || bucketItem.key;')) throw new Error('resolveStreamSource still prefers stale preparedKey'); if(s.includes('const effectiveProfile = media?.preparedProfile || media?.profile;')) throw new Error('remote start still prefers stale prepared profile');"
